[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-arm-teleop"
version = "0.1.0"
description = "PICO, SenseGlove, and IsaacLab integration code for ESROBO dual-arm teleoperation."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
